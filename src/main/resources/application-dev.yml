server:
  port: 9091

spring:
  datasource:
    url: jdbc:h2:mem:shopping_cart_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  h2:
    console:
      enabled: true