spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shopping_cart_db
    username: shopping_user
    password: shopping_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC